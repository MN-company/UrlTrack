<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UrlTrack — Verify</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/urltrack.css') }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
  <main class="launcher">
    <div style="max-width:440px;margin:0 auto;width:100%">
      <div class="brand" style="padding-left:0;margin-bottom:18px"><span class="brand-mark">U</span> UrlTrack</div>
      <p class="eyebrow">Verify second factor</p>
      <h1>Confirm your identity.</h1>
      <p>Account: <strong>{{ email }}</strong></p>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="panel pad" style="margin:14px 0;border-color:{% if category=='error' %}var(--danger){% else %}var(--warn){% endif %}">{{ message }}</div>
      {% endfor %}
      {% endwith %}

      <div class="panel pad" style="margin-top:18px">
        <form method="POST" id="totpForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="field"><label>Authenticator code</label><input class="input mono" name="totp_code" type="text" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required autofocus></div>
          <button type="submit" class="btn primary" style="width:100%;margin-top:12px">Verify code</button>
        </form>
        <div style="height:1px;background:var(--border);margin:18px 0"></div>
        <form method="POST" id="backupForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="field"><label>Backup code</label><input class="input mono" name="backup_code" type="text" placeholder="Paste a recovery code"></div>
          <button type="submit" class="btn" style="width:100%;margin-top:12px">Use backup code</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
