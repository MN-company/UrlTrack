{% extends "gate_base.html" %}

{% block title %}Tracking Consent{% endblock %}

{% block content %}
<h1>Consent required</h1>
<p>This link uses cookies and device signals for routing and fraud prevention. Consent is required before continuing.</p>

<form method="POST" action="{{ url_for('public.record_consent') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <button type="submit">I consent</button>
</form>
{% endblock %}
