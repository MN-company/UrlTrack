{% extends "gate_base.html" %}

{% block title %}Security Check{% endblock %}

{% block head %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer nonce="{{ csp_nonce|default('') }}"></script>
{% endblock %}

{% block content %}
<h1>Security check</h1>
<p>Complete the challenge below to continue.</p>

<form id="captcha-form" method="POST" action="{{ url_for('public.verify_captcha') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="slug" value="{{ slug }}">
    <input type="hidden" name="visit_id" value="{{ visit_id }}">
    <input type="hidden" name="canvas_hash" id="canvas_hash_field" value="">
    <div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark" style="margin-bottom: 1rem;"></div>
    <button type="submit">Verify</button>
</form>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce|default('') }}">
(function () {
    function murmurhash3(key, seed) {
        var remainder = key.length & 3, bytes = key.length - remainder;
        var h1 = seed, c1 = 0xcc9e2d51, c2 = 0x1b873593, i = 0, k1;
        while (i < bytes) {
            k1=(key.charCodeAt(i)&0xff)|((key.charCodeAt(++i)&0xff)<<8)|((key.charCodeAt(++i)&0xff)<<16)|((key.charCodeAt(++i)&0xff)<<24);++i;
            k1=((((k1&0xffff)*c1)+((((k1>>>16)*c1)&0xffff)<<16)))&0xffffffff);k1=(k1<<15)|(k1>>>17);
            k1=((((k1&0xffff)*c2)+((((k1>>>16)*c2)&0xffff)<<16)))&0xffffffff);h1^=k1;
            h1=(h1<<13)|(h1>>>19);var h1b=((((h1&0xffff)*5)+((((h1>>>16)*5)&0xffff)<<16)))&0xffffffff);
            h1=(((h1b&0xffff)+0x6b64)+((((h1b>>>16)+0xe654)&0xffff)<<16));
        }
        k1=0;
        switch(remainder){
            case 3:k1^=(key.charCodeAt(i+2)&0xff)<<16;
            case 2:k1^=(key.charCodeAt(i+1)&0xff)<<8;
            case 1:k1^=(key.charCodeAt(i)&0xff);
            k1=(((k1&0xffff)*c1)+((((k1>>>16)*c1)&0xffff)<<16))&0xffffffff;
            k1=(k1<<15)|(k1>>>17);
            k1=(((k1&0xffff)*c2)+((((k1>>>16)*c2)&0xffff)<<16))&0xffffffff;
            h1^=k1;
        }
        h1^=key.length;h1^=h1>>>16;
        h1=(((h1&0xffff)*0x85ebca6b)+((((h1>>>16)*0x85ebca6b)&0xffff)<<16))&0xffffffff;h1^=h1>>>13;
        h1=((((h1&0xffff)*0xc2b2ae35)+((((h1>>>16)*0xc2b2ae35)&0xffff)<<16)))&0xffffffff);h1^=h1>>>16;
        return (h1>>>0).toString(16);
    }

    function getCanvasHash() {
        try {
            var c = document.createElement('canvas');
            var ctx = c.getContext('2d');
            ctx.textBaseline = "alphabetic";
            ctx.font = "14px Arial";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = "#069";
            ctx.fillText("ulrTrack_V45_Stable", 2, 15);
            ctx.fillStyle = "rgba(102,204,0,0.7)";
            ctx.fillText("Is this stable?", 4, 17);
            return murmurhash3(c.toDataURL(), 256);
        } catch (e) { return null; }
    }

    var form = document.getElementById('captcha-form');
    var hashField = document.getElementById('canvas_hash_field');

    form.addEventListener('submit', function () {
        hashField.value = getCanvasHash() || '';
    });
})();
</script>
{% endblock %}
