{% extends "gate_base.html" %}

{% block title %}Verify Email{% endblock %}

{% block content %}
<h1>Email verification</h1>
<p>This link requires a valid email address before continuing.</p>

<form method="POST" action="{{ url_for('public.verify_email') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="slug" value="{{ slug }}">
    <input type="hidden" name="visit_id" value="{{ visit_id }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" placeholder="name@example.com" required autofocus>
    <button type="submit">Continue</button>
</form>
{% endblock %}

{% block scripts %}
{% if allow_partial_email_capture %}
<script nonce="{{ csp_nonce|default('') }}">
    const input = document.getElementById('email');
    let timer;

    function sendPartial(value) {
        if (!value) return;
        const payload = new FormData();
        payload.append('visit_id', '{{ visit_id }}');
        payload.append('visit_token', '{{ visit_token }}');
        payload.append('partial_email', value);
        navigator.sendBeacon("{{ url_for('api.partial_email') }}", payload);
    }

    input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => sendPartial(input.value.trim()), 600);
    });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') sendPartial(input.value.trim());
    });
</script>
{% endif %}
{% endblock %}
