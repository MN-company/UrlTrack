{% extends "base.html" %}

{% block breadcrumb %}System / Settings{% endblock %}

{% block content %}
<div class="dashboard-grid" style="grid-template-columns: 1.1fr 0.9fr;">
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-filter-circle-xmark"></i> Email Domain Lists</span>
        </div>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
            Manage the local data files used to reject disposable or privacy-focused email domains.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="settings_scope" value="domains">

            <div class="form-group">
                <label>Disposable domains</label>
                <textarea name="disposable_domains" rows="10" style="width:100%;font-family:'JetBrains Mono', monospace;">{{ disposable_domains }}</textarea>
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>Privacy domains</label>
                <textarea name="privacy_domains" rows="10" style="width:100%;font-family:'JetBrains Mono', monospace;">{{ privacy_domains }}</textarea>
            </div>

            <div style="display:flex;justify-content:flex-end;margin-top:1rem;">
                <button type="submit" class="btn btn-primary">Save domain lists</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-server"></i> Runtime Configuration</span>
        </div>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="settings_scope" value="runtime">

            <div class="form-group">
                <label>SERVER_URL</label>
                <input type="text" name="server_url" value="{{ server_url }}">
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>GEMINI_API_KEY</label>
                <input type="password" name="gemini_api_key" placeholder="leave empty to keep current">
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>GEMINI_MODEL</label>
                <input type="text" name="gemini_model" value="{{ gemini_model }}">
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>WEBHOOK_URL</label>
                <input type="text" name="webhook_url" value="{{ webhook_url or '' }}">
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>WEBHOOK_SECRET</label>
                <input type="password" name="webhook_secret" placeholder="leave blank to keep current">
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>TELEGRAM_BOT_TOKEN</label>
                <input type="password" name="telegram_bot_token" placeholder="leave blank to keep current">
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>TELEGRAM_CHAT_ID</label>
                <input type="text" name="telegram_chat_id" value="{{ telegram_chat_id }}">
            </div>

            <div class="toggle-row" style="margin-top:1rem;">
                <label for="mask_with_isgd">MASK_WITH_ISGD</label>
                <input id="mask_with_isgd" type="checkbox" name="mask_with_isgd" {% if mask_with_isgd %}checked{% endif %}>
            </div>

            <div class="toggle-row" style="margin-top:1rem;">
                <label for="trust_proxy_headers">TRUST_PROXY_HEADERS</label>
                <input id="trust_proxy_headers" type="checkbox" name="trust_proxy_headers" {% if trust_proxy_headers %}checked{% endif %}>
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>VISIT_RETENTION_DAYS</label>
                <input type="number" name="visit_retention_days" min="1" max="3650" value="{{ visit_retention_days }}">
            </div>

            <div style="display:flex;justify-content:flex-end;margin-top:1rem;">
                <button type="submit" class="btn btn-primary">Save configuration</button>
            </div>
        </form>

        <div style="margin-top:1.5rem;">
            <a href="{{ url_for('dashboard.dashboard_security.security_settings') }}" class="btn btn-ghost w-full" style="justify-content:center;">
                <i class="fa-solid fa-shield-halved"></i> Manage authentication security
            </a>
        </div>
    </div>
</div>
{% endblock %}
