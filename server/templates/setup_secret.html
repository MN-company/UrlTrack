<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Secret</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: Inter, sans-serif; }
        .card { width: min(620px, calc(100vw - 2rem)); padding: 2rem; border-radius: 24px; background: #111827; border: 1px solid rgba(148,163,184,0.18); }
        .secret { font-family: "JetBrains Mono", monospace; font-size: 1.35rem; letter-spacing: 0.08em; background: rgba(59,130,246,0.12); border-radius: 16px; padding: 1rem; margin: 1.5rem 0; word-break: break-word; }
        a { color: white; text-decoration: none; display: inline-flex; padding: 0.9rem 1.1rem; border-radius: 12px; background: #3b82f6; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Store this secret code now</h1>
        <p>This code is shown only once. You’ll need it later to create additional admin accounts from the security settings page.</p>
        <div class="secret">{{ secret_code }}</div>
        <a href="{{ url_for('dashboard.dashboard_security.security_settings') }}">Continue to dashboard security</a>
    </div>
</body>
</html>
