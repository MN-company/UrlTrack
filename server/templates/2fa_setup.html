{% extends "base.html" %}

{% block breadcrumb %}Security / 2FA Setup{% endblock %}

{% block content %}
<div style="max-width:520px;margin:2rem auto;">
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-qrcode"></i> Configure authenticator app</span>
        </div>
        <p style="color:var(--text-secondary);margin-bottom:1rem;">
            Scan the QR code below with your authenticator app, then enter the 6-digit code to confirm setup for <strong>{{ email }}</strong>.
        </p>

        <div style="display:flex;justify-content:center;margin:1.5rem 0;">
            <img src="data:image/png;base64,{{ qr_code }}" alt="TOTP QR code" style="max-width:220px;border-radius:12px;background:#fff;padding:1rem;">
        </div>

        <div class="toggle-row" style="margin-bottom:1rem;">
            <label>Manual secret</label>
            <span class="text-mono">{{ secret }}</span>
        </div>

        <form action="{{ url_for('dashboard.dashboard_security.verify_2fa_setup') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="totp_code">Verification code</label>
            <input id="totp_code" name="totp_code" type="text" maxlength="6" pattern="[0-9]{6}" required autofocus>
            <button class="btn btn-primary w-full">Enable 2FA</button>
        </form>
    </div>
</div>
{% endblock %}
