{% extends "base.html" %}

{% block breadcrumb %}Security / Backup Codes{% endblock %}

{% block content %}
<div style="max-width:680px;margin:2rem auto;">
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-life-ring"></i> Backup codes</span>
        </div>
        <p style="color:var(--text-secondary);margin-bottom:1rem;">
            Save these one-time codes somewhere safe. Each code works only once.
        </p>

        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:0.75rem;">
            {% for code in backup_codes %}
            <div class="toggle-row">
                <label>Recovery code</label>
                <span class="text-mono">{{ code }}</span>
            </div>
            {% endfor %}
        </div>

        <div style="margin-top:1.5rem;display:flex;justify-content:flex-end;">
            <a href="{{ url_for('dashboard.dashboard_security.security_settings') }}" class="btn btn-primary">Back to security</a>
        </div>
    </div>
</div>
{% endblock %}
