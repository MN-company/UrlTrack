limit_req_zone $binary_remote_addr zone=ulrtrack_redirect:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ulrtrack_auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location /static/ {
        alias /opt/ulrtrack/static/;
        access_log off;
        expires 1d;
    }

    location ~ ^/(login|setup|verify_email|verify_password|verify_captcha|api/) {
        limit_req zone=ulrtrack_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=ulrtrack_redirect burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
